<aside class="sidebar">
  <!-- Brand -->
  <div class="sidebar-brand">
    <div class="brand-icon">
      <img src="logo.png" alt="Logo" class="brand-logo-img" />
    </div>
    <div class="brand-text">
      <span class="brand-name">CreditFlow</span>
      <span class="brand-sub">Plateforme de Crédit</span>
    </div>
  </div>

  <!-- User identity -->
  <div class="sidebar-user">
    <div class="user-initials">{{ (user?.username || 'U').charAt(0).toUpperCase() }}</div>
    <div class="user-details">
      <span class="user-name">{{ user?.username || 'Utilisateur' }}</span>
      <span class="user-role">{{ userRole | titlecase }}</span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <ul class="nav-list">
      <li *ngFor="let item of visibleNavItems" class="nav-item">
        <button (click)="navigate(item.path)" class="nav-btn">
          <span class="nav-icon" [innerHTML]="item.iconSvg"></span>
          <span class="nav-label">{{ item.label }}</span>
        </button>
      </li>
    </ul>
  </nav>

  <!-- Footer -->
  <div class="sidebar-footer">
    <button (click)="logout()" class="logout-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Se déconnecter</span>
    </button>
  </div>
</aside>
