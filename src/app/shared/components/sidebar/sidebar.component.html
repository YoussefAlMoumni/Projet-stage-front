<aside class="sidebar">
  <div class="sidebar-header">
    <h2>Credit Platform</h2>
    <div class="user-info">
      <span class="user-name">{{ user?.username || 'User' }}</span>
      <span class="user-role">{{ userRole || 'Guest' }}</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <ul class="nav-list">
      <li *ngFor="let item of visibleNavItems" class="nav-item">
        <button (click)="navigate(item.path)" class="nav-button">
          <span class="nav-icon">{{ item.icon }}</span>
          <span class="nav-label">{{ item.label }}</span>
        </button>
      </li>
    </ul>
  </nav>

  <div class="sidebar-footer">
    <button (click)="logout()" class="logout-button">
      <span class="logout-icon">log-out</span>
      <span>Logout</span>
    </button>
  </div>
</aside>
