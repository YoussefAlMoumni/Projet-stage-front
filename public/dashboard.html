<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CreditFlow Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CreditFlow role dashboard.">
  <meta name="theme-color" content="#f5f5f2">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="creditflow.css">
</head>
<body>
  <main class="page-shell dashboard-main" hidden>
    <nav class="topbar" aria-label="Primary navigation">
      <a class="brand" href="dashboard.html" aria-label="CreditFlow dashboard">
        <img class="brand-mark" src="favicon.ico" alt="CreditFlow logo">
        <span>CreditFlow</span>
      </a>
      <button class="quiet-btn" id="logoutButton" type="button">Log Out</button>
    </nav>

    <section class="dashboard-panel role-dashboard">
      <div class="dashboard-top">
        <div>
          <p class="eyebrow">Signed in as <span id="usernameLabel"></span></p>
          <h1 id="dashboardTitle">Dashboard</h1>
        </div>
        <span class="role-pill" id="userRole">Role</span>
      </div>

      <div id="dashboardList" class="data-list" aria-live="polite"></div>
      <p id="dashboardStatus" class="status-message" role="status"></p>

      <form id="userCrudForm" class="crud-form" hidden>
        <input id="userId" type="hidden">
        <label class="field">
          <span>Username</span>
          <input id="userUsername" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input id="userPassword" type="password">
        </label>
        <label class="field">
          <span>First name</span>
          <input id="userFirstName" required>
        </label>
        <label class="field">
          <span>Last name</span>
          <input id="userLastName" required>
        </label>
        <label class="field">
          <span>Email</span>
          <input id="userEmail" type="email" required>
        </label>
        <label class="field">
          <span>National ID</span>
          <input id="userNationalId" required>
        </label>
        <label class="field">
          <span>Role</span>
          <select id="userRoleInput" required>
            <option value="admin">Admin</option>
            <option value="manager">Manager</option>
            <option value="analyst">Analyst</option>
          </select>
        </label>
        <div class="form-row">
          <button class="dark-btn" type="submit">Save User</button>
          <button class="quiet-btn" id="resetUserForm" type="button">New User</button>
        </div>
      </form>
    </section>
  </main>

  <script src="auth.js"></script>
  <script>
    const session = window.CreditFlowAuth.getSession();
    const main = document.querySelector(".dashboard-main");
    const status = document.querySelector("#dashboardStatus");
    const list = document.querySelector("#dashboardList");
    const userCrudForm = document.querySelector("#userCrudForm");
    let activeConfig = null;
    let activeRows = [];

    if (!session) {
      window.location.replace("login.html");
    } else {
      main.hidden = false;
      document.querySelector("#usernameLabel").textContent = session.username;
      document.querySelector("#userRole").textContent = session.role.replace("ROLE_", "").replace("_", " ");
      loadDashboard(session);
    }

    document.querySelector("#logoutButton").addEventListener("click", () => {
      window.CreditFlowAuth.clearSession();
      window.location.href = "login.html";
    });

    async function loadDashboard(activeSession) {
      const config = getDashboardConfig(activeSession.role);
      if (!config) {
        status.textContent = "No dashboard is available for this role.";
        return;
      }

      document.querySelector("#dashboardTitle").textContent = config.title;
      activeConfig = config;
      userCrudForm.hidden = activeSession.role !== "ROLE_ADMIN";
      status.textContent = "Loading...";
      try {
        const rows = await window.CreditFlowAuth.getJson(config.path);
        activeRows = rows;
        renderRows(rows, config);
        status.textContent = "";
      } catch (error) {
        list.innerHTML = "";
        status.textContent = error.message;
        status.className = "status-message error";
      }
    }

    function getDashboardConfig(role) {
      if (role === "ROLE_ADMIN") {
        return {
          title: "Employees",
          path: "/admin/employees",
          columns: ["ID", "Username", "First name", "Last name", "Email", "Role", "Actions"],
          values: (row) => [row.id, row.username, row.firstName, row.lastName, row.email, row.role],
          actions: true
        };
      }
      if (role === "ROLE_MANAGER") {
        return {
          title: "Analysts",
          path: "/manager/analysts",
          columns: ["ID", "Username", "First name", "Last name", "Email"],
          values: (row) => [row.id, row.username, row.firstName, row.lastName, row.email]
        };
      }
      if (role === "ROLE_ANALYST") {
        return {
          title: "Pending dossiers",
          path: "/analyst/dossiers/pending",
          columns: ["ID", "SIREN", "Client type", "Status", "Created"],
          values: (row) => [row.id, row.siren || "-", row.clientType, row.status, formatDate(row.creationDate)]
        };
      }
      return null;
    }

    function renderRows(rows, config) {
      if (!Array.isArray(rows) || rows.length === 0) {
        list.innerHTML = `<p class="empty-state">No records found.</p>`;
        return;
      }

      const header = config.columns.map((column) => `<span>${escapeHtml(column)}</span>`).join("");
      const body = rows.map((row) => {
        let cells = config.values(row).map((value) => `<span>${escapeHtml(String(value ?? ""))}</span>`).join("");
        if (config.actions) {
          cells += `<span class="action-cell"><button class="text-link" data-action="edit" data-id="${row.id}" type="button">Edit</button><button class="text-link danger" data-action="delete" data-id="${row.id}" type="button">Delete</button></span>`;
        }
        return `<div class="data-row">${cells}</div>`;
      }).join("");
      list.innerHTML = `<div class="data-table" style="--columns:${config.columns.length}"><div class="data-header">${header}</div>${body}</div>`;
    }

    list.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const id = Number(button.dataset.id);
      const row = activeRows.find((item) => item.id === id);
      if (button.dataset.action === "edit" && row) {
        fillUserForm(row);
      }
      if (button.dataset.action === "delete") {
        await window.CreditFlowAuth.deleteJson(`/admin/users/${id}`);
        resetUserForm();
        await loadDashboard(session);
      }
    });

    userCrudForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const id = document.querySelector("#userId").value;
      const payload = readUserForm();
      if (id) {
        await window.CreditFlowAuth.putJson(`/admin/users/${id}`, payload);
      } else {
        await window.CreditFlowAuth.postJson("/admin/users", payload);
      }
      resetUserForm();
      await loadDashboard(session);
    });

    document.querySelector("#resetUserForm").addEventListener("click", resetUserForm);

    function fillUserForm(row) {
      document.querySelector("#userId").value = row.id || "";
      document.querySelector("#userUsername").value = row.username || "";
      document.querySelector("#userPassword").value = "";
      document.querySelector("#userFirstName").value = row.firstName || "";
      document.querySelector("#userLastName").value = row.lastName || "";
      document.querySelector("#userEmail").value = row.email || "";
      document.querySelector("#userNationalId").value = row.nationalId || "";
      document.querySelector("#userRoleInput").value = row.role || "manager";
    }

    function readUserForm() {
      const payload = {
        username: document.querySelector("#userUsername").value.trim(),
        password: document.querySelector("#userPassword").value,
        firstName: document.querySelector("#userFirstName").value.trim(),
        lastName: document.querySelector("#userLastName").value.trim(),
        email: document.querySelector("#userEmail").value.trim(),
        nationalId: document.querySelector("#userNationalId").value.trim(),
        role: document.querySelector("#userRoleInput").value
      };
      if (!payload.password) {
        delete payload.password;
      }
      return payload;
    }

    function resetUserForm() {
      userCrudForm.reset();
      document.querySelector("#userId").value = "";
      document.querySelector("#userRoleInput").value = "manager";
    }

    function formatDate(value) {
      if (!value) return "-";
      return String(value).replace("T", " ").slice(0, 16);
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      })[char]);
    }
  </script>
</body>
</html>
