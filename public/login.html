<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CreditFlow Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CreditFlow login.">
  <meta name="theme-color" content="#f5f5f2">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="creditflow.css">
</head>
<body>
  <main class="page-shell">
    <nav class="topbar" aria-label="Primary navigation">
      <a class="brand" href="login.html" aria-label="CreditFlow login">
        <img class="brand-mark" src="favicon.ico" alt="CreditFlow logo">
        <span>CreditFlow</span>
      </a>
    </nav>

    <section class="auth-page login-only">
      <div class="auth-intro">
        <p class="eyebrow">CreditFlow</p>
        <h1>Sign in</h1>
      </div>

      <div class="auth-panel" aria-label="Authentication panel">
        <form id="signInForm" class="auth-form">
          <label class="field">
            <span>Username</span>
            <input id="signinUsername" name="username" autocomplete="username" required>
          </label>
          <label class="field">
            <span>Password</span>
            <input id="signinPassword" name="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="dark-btn" type="submit">Sign In</button>
          <p id="signInStatus" class="status-message" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <script src="auth.js"></script>
  <script>
    const signInForm = document.querySelector("#signInForm");
    const signInStatus = document.querySelector("#signInStatus");

    function setStatus(message, type) {
      signInStatus.textContent = message;
      signInStatus.className = `status-message ${type || ""}`.trim();
    }

    signInForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const username = document.querySelector("#signinUsername").value.trim();
      const password = document.querySelector("#signinPassword").value;
      setStatus("Signing in...", "");
      try {
        await window.CreditFlowAuth.signIn(username, password);
        window.location.href = "dashboard.html";
      } catch (error) {
        setStatus(error.message, "error");
      }
    });
  </script>
</body>
</html>
